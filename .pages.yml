# OPTIMAX Homepage · Pages CMS
# Empty optional image field preserves the current artwork.
media:
  input: media
  output: /media
  rename: safe
  extensions:
    - png
    - jpg
    - jpeg
    - webp
    - gif
    - svg
    - mp4
    - webm
content:
  - name: settings
    label: "01 · Site Settings"
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: page_title
        label: "Page Title"
        type: string
      - name: description
        label: "Description"
        type: text
      - name: header_button_label
        label: "Header Button Label"
        type: string
      - name: header_button_link
        label: "Header Button Link"
        type: string
      - name: header_logo
        label: "Header Logo (leave blank to keep current)"
        type: image
        options:
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - gif
            - svg
      - name: footer_logo
        label: "Footer Logo (leave blank to keep current)"
        type: image
        options:
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - gif
            - svg
      - name: header_logo_width
        label: "Header Logo Width - Desktop (px)"
        type: number
      - name: header_logo_max_height
        label: "Header Logo Maximum Height (px)"
        type: number
      - name: header_logo_mobile_width
        label: "Header Logo Width - Mobile (px)"
        type: number
      - name: footer_logo_width
        label: "Footer Logo Width (px)"
        type: number
      - name: footer_logo_max_height
        label: "Footer Logo Maximum Height (px)"
        type: number
  - name: hero
    label: "02 · Hero"
    type: file
    path: content/hero.json
    format: json
    fields:
      - name: image
        label: "Image (leave blank to keep current)"
        type: image
        options:
          extensions:
            - png
            - jpg
            - jpeg
            - webp
            - gif
            - svg
      - name: eyebrow
        label: "Eyebrow"
        type: string
      - name: title_line_1
        label: "Title Line 1"
        type: string
      - name: title_line_2
        label: "Title Line 2"
        type: string
      - name: title_accent
        label: "Title Accent"
        type: string
      - name: description
        label: "Description"
        type: text
      - name: button_primary_label
        label: "Button Primary Label"
        type: string
      - name: button_primary_link
        label: "Button Primary Link"
        type: string
      - name: button_secondary_label
        label: "Button Secondary Label"
        type: string
      - name: footnote
        label: "Footnote"
        type: string
      - name: side_label
        label: "Side Label"
        type: string
      - name: video
        label: "Video (optional MP4/WebM)"
        type: file
        options:
          extensions:
            - mp4
            - webm
  - name: stats
    label: "03 · Trust Statistics"
